baseURL = 'https://r-cecilia.github.io/'
title = 'Welcome to My Blog'
theme = "reimu" 

defaultContentLanguage = 'zh-CN'
[languages]
[languages.zh-CN]
label = '简体中文'
locale = 'zh-CN'
weight = 1
hasCJKLanguage = true

[markup.highlight]
guessSyntax = true
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[caches]
[caches.assets]
dir = ':cacheDir/assets'
[caches.images]
dir = ':cacheDir/images'
