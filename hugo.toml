baseURL = 'https://R-Cecilia.github.io/'
locale = 'en-us'
title = 'Welcome to My Blog'
theme = "reimu" 

languageCode = 'zh-CN'
defaultContentLanguage = 'zh-CN'
[languages]
[languages.zh-CN]
languageName = '简体中文'
weight = 1
hasCJKLanguage = true

[markup.highlight]
guessSyntax = true
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[caches]
[caches.images]
dir = ':cacheDir/images'
