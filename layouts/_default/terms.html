{{- define "main" -}}
  <div class="site-page">
    <section class="content-panel glass-panel">
      <header class="section-heading"><h1>{{ if eq .Type "categories" }}知识分类{{ else }}标签{{ end }}</h1></header>
      <ul class="term-list">
        {{- range .Data.Terms.Alphabetical -}}
          <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}<span>{{ .Count }}</span></a></li>
        {{- end -}}
      </ul>
    </section>
  </div>
{{- end -}}
