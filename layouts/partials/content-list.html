<ul class="content-list">
  {{- range .pages -}}
    <li class="content-row">
      <div class="content-row-copy">
        <a class="content-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{- if $.showTopic -}}<a class="content-topic" href="{{ .CurrentSection.RelPermalink }}">{{ .CurrentSection.Title }}</a>{{- end -}}
      </div>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    </li>
  {{- else -}}
    <li class="empty-state">暂无内容</li>
  {{- end -}}
</ul>
